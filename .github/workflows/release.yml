# 发布：推一个 v* tag 就发到 npm，并建一个 GitHub Release。
#
# 触发方式是打 tag，不是推 main——发版和改代码是两件事，混在一起容易把半成品发出去：
#
#   node tools/check-version.js        # package.json 与 manifest.json 必须一致
#   git tag v1.7.1 && git push origin v1.7.1
#
# 身份验证用 npm Trusted Publishing（OIDC），不再用长期 token：长期 Automation
# token 已停发，classic secret 在 npm 2025 年底的 token 改版后不再是官方推荐路径。
# 首次启用前需要在 npmjs.com 配一次（包 → Settings →
# Trusted Publishing），填这个仓库与 workflow 文件名：
#
#   Owner: hhhwdt        Repository: agent-browser-bridge
#   Workflow filename: release.yml
#
# 没配这一步时发布会在 npm publish 失败（registry 不认 OIDC 身份），不会静默跳过。
#
# 运行时要求：npm 的 OIDC 发布需要 npm ≥ 11.5，Node 22 自带的 npm 不到这个版本，
# 所以发布前先升级 npm。
#
# 发布前不需要单独的测试步骤：npm publish 会先跑 package.json 里的 prepublishOnly，
# 那一步执行完整离线套件，失败就不会发布。跑两遍没意义，所以这里不重复。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # 建 GitHub Release
  id-token: write   # npm Trusted Publishing 用 OIDC 身份，也用于 provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: tag 与 package.json 的版本必须一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          if [ "$tag" != "$pkg" ]; then
            echo "tag 是 $tag，package.json 是 $pkg，两者必须一致"
            exit 1
          fi
          echo "准备发布 $pkg"

      - name: 升级 npm 到支持 trusted publishing 的版本（>=11.5）
        run: npm install -g npm@latest

      - name: 发布到 npm（Trusted Publishing + 来源证明，无需 token）
        run: npm publish --provenance --access public
        env:
          ABB_MCP_OFFLINE: '1'   # 发布机上没有浏览器，跳过 MCP 的真实调用那一节

      - name: 建 GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
