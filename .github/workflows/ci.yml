# 离线测试：不需要浏览器、不需要 test-config.js、不碰任何正在运行的服务。
#
# 这些套件各自在隔离端口上启动自己的 server.js，或在 Node 里用替身驱动扩展的注入函数，
# 因此能在干净的 CI 机器上跑。需要真实浏览器的部分（test-live.js、test-basic.js 等）
# 不在这里跑——那需要一个已登录的浏览器和一个配置好的测试页。
#
# Windows 那一档不是陪跑：这个工具的主场就是 Windows（scripts/ 是 PowerShell，路径写法、
# 行尾、npm 的 .cmd 调用都和 Linux 不同），只在 ubuntu 上绿说明不了 Windows 能用。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 里写的是 >=18，这里把那句话验掉
        node-version: ['18', '20', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: 依赖情况（应当没有任何第三方依赖）
        run: |
          node -e "const p=require('./package.json');const n=Object.keys(p.dependencies||{}).length;console.log('dependencies:', n);if(n){process.exit(1)}"

      - name: 离线套件
        env:
          ABB_MCP_OFFLINE: '1'
        run: node test/test-offline.js

  offline-windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['18', '22']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: 依赖情况（应当没有任何第三方依赖）
        run: |
          node -e "const p=require('./package.json');const n=Object.keys(p.dependencies||{}).length;console.log('dependencies:', n);if(n){process.exit(1)}"

      - name: 离线套件
        env:
          ABB_MCP_OFFLINE: '1'
        run: node test/test-offline.js

  browser-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          # v2 默认装 Chrome for Testing 构建——branded stable 从 137 起忽略
          # --load-extension，扩展根本不会加载，这个 job 曾经因此全红
          install-dependencies: true

      - name: 浏览器层测试（headless Chrome + test-live.js）
        run: |
          # --no-token：CI 是一次性环境，全新 profile 里的扩展没有 token，
          # 401 后轮询直接停止，扩展永远连不上。
          # --no-update-check：测试机上不查 npm 更新，日志保持干净。
          node src/server.js --no-token --no-update-check &
          SERVER_PID=$!
          sleep 2
          CHROME_PATH="${{ steps.chrome.outputs.chrome-path }}"
          if [ -z "$CHROME_PATH" ]; then
            echo "Chrome not found"
            exit 1
          fi
          "$CHROME_PATH" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --load-extension="$(pwd)/extension" \
            --user-data-dir="/tmp/abb-ci-profile" \
            --remote-debugging-port=9222 \
            about:blank &
          CHROME_PID=$!
          echo "等待扩展连接..."
          for i in $(seq 1 30); do
            if curl -s http://127.0.0.1:18777/health | grep -q '"extensionConnected":true'; then
              echo "扩展已连接"
              break
            fi
            sleep 1
          done
          node test/test-live.js
          TEST_EXIT=$?
          kill $CHROME_PID 2>/dev/null || true
          kill $SERVER_PID 2>/dev/null || true
          exit $TEST_EXIT
