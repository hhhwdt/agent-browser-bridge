<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    body {
      font-family: "Microsoft YaHei", system-ui, sans-serif;
      font-size: 13px;
      width: 340px;
      margin: 0;
      padding: 12px;
      color: #1f2328;
    }
    h3 { margin: 0 0 8px; font-size: 14px; }
    .row { margin: 6px 0; display: flex; align-items: center; gap: 6px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #d0d7de; flex: none; }
    .dot.ok { background: #1a7f37; }
    .dot.bad { background: #cf222e; }
    input[type=text] {
      flex: 1;
      padding: 4px 6px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      font-size: 12px;
    }
    button {
      padding: 4px 10px;
      border: 1px solid #d0d7de;
      border-radius: 4px;
      background: #f6f8fa;
      cursor: pointer;
      font-size: 12px;
    }
    button:hover { background: #eaeef2; }
    button.primary { background: #1f883d; border-color: #1f883d; color: #fff; }
    button.primary:hover { background: #1a7f37; }
    .muted { color: #656d76; font-size: 11px; line-height: 1.5; }
    ul { margin: 6px 0; padding-left: 18px; }
    li { margin: 2px 0; font-size: 11px; color: #656d76; }
    hr { border: 0; border-top: 1px solid #eaeef2; margin: 10px 0; }
  </style>
</head>
<body>
  <h3 data-i18n="appName"></h3>

  <div class="row">
    <span class="dot" id="bridgeDot"></span>
    <span id="bridgeStatus" data-i18n="statusChecking"></span>
  </div>

  <hr />

  <div class="muted" data-i18n="marksHeading"></div>
  <div class="row">
    <span id="markSummary" data-i18n="loading"></span>
    <button id="clearMarksBtn" data-i18n="clearMarks"></button>
  </div>
  <div class="muted" id="markHint" data-i18n="marksHint"></div>

  <hr />

  <div class="muted" data-i18n="originsHeading"></div>
  <ul id="originList"></ul>

  <div class="row">
    <input type="text" id="originInput" />
    <button id="grantBtn" class="primary" data-i18n="grant"></button>
  </div>

  <div class="row">
    <button id="grantAllBtn" data-i18n="grantAll"></button>
    <button id="revokeAllBtn" data-i18n="revokeAll"></button>
  </div>

  <hr />

  <div class="muted" data-i18n="advHeading"></div>
  <ul id="advList"></ul>
  <div class="row">
    <button id="grantAdvBtn" class="primary" data-i18n="grantAdv"></button>
    <button id="revokeAdvBtn" data-i18n="revokeAdv"></button>
  </div>
  <div class="muted">
    <span data-i18n="advHintPre"></span><b>session</b><span data-i18n="advHintPost"></span>
  </div>

  <hr />

  <div class="muted" data-i18n="tokenHeading"></div>
  <div class="row">
    <input type="text" id="tokenInput" data-i18n-placeholder="tokenPlaceholder" />
    <button id="tokenSaveBtn" data-i18n="tokenSave"></button>
  </div>
  <div class="muted" id="tokenHint" data-i18n="tokenHint"></div>

  <hr />

  <div class="muted" data-i18n="debuggerNote"></div>

  <hr />

  <div class="muted" data-i18n="localNote"></div>

  <hr />

  <div class="muted">
    <span data-i18n="extIdLabel"></span> <span id="extId" data-i18n="loading"></span><br />
    <span data-i18n-html="extIdNote"></span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
